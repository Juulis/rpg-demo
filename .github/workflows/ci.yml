name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Sätt ihop Pages-artefakten (3D på roten, TS under next/)
        run: node scripts/assemble-pages.mjs
      - run: npx playwright install --with-deps chromium
      - name: Röktest – roten spelbar, next/ laddar
        run: npm run smoke

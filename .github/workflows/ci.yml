name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Headless-test (jsdom, stub-motor)
        run: npm test
      - run: npm run build
      - name: Sätt ihop Pages-artefakten (2D på roten, next/ omdirigerar)
        run: node scripts/assemble-pages.mjs
      - run: npx playwright install --with-deps chromium
      - name: Röktest – vanligt produktionsbygge
        run: SMOKE_MODE=plain npm run smoke
      - run: VITE_CAPTURE_HOOK=true npm run build
      - name: Sätt ihop Pages-artefakten (capture)
        run: node scripts/assemble-pages.mjs
      - name: Röktest – capture-hook
        run: npm run smoke
